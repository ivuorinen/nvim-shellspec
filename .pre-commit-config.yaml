---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github # or stylua-system / stylua

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.json, --fix]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      # No --severity override: the default surfaces info-level findings too.
      # Suppress individual checks at the site with `# shellcheck disable=`, or
      # in .shellcheckrc -- a global floor hides a whole class forever.
      - id: shellcheck

  # luacheck is pinned in mise.toml and invoked through `mise exec`, rather than
  # via its official hook at https://github.com/lunarmodules/luacheck.
  #
  # That hook declares `language: lua`, which pre-commit builds with luarocks:
  # on a machine without it the hook dies during environment setup with
  # "Executable `luarocks` not found" (verified). `language` cannot be
  # overridden per-hook in this file, so using the official hook would mean
  # adding lua + luarocks to every contributor machine and CI runner. Going
  # through mise keeps one pinned version that `make lint-lua` and this hook
  # share.
  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        description: Lint and static analysis of Lua code
        entry: mise exec -- luacheck
        language: system
        types: [lua]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: "3.3.19"
    hooks:
      - id: checkov
        args:
          - "--quiet"
